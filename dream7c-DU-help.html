		<h1 class="tx1">柒幻 扬琴 使用帮助</h1>
		<div class="mdiv tx3">
			<p>1、下载并解压rar到本地；</p>
			<p>2、在Chrome浏览器地址中输入以下内容后按下回车（Enter）：<br/>
				<ul>
					<li>
						<b>chrome://extensions/</b>
					</li>
				</ul>
				&nbsp;&nbsp;&nbsp;&nbsp;或点击菜单中的<b>扩展程序-管理扩展程序</b>进入<b>“扩展程序界面”；</b>
			<p>3、开启<b>“开发者模式”</b>然后点击<b>“加载未打包的扩展程序”</b>；</p>
			<img src="images/dream7c DU/dream7c DU help1.png" width="100%" />
			<p>4、选中解压后的文件夹；</p>
			<p>5、在Chrome中点击扩展程序图标后点击<b>“柒幻 扬琴”</b>后即可调用，也可以选择固定扩展程序以便经常使用；</p>
			<img src="images/dream7c DU/dream7c DU help2.png" width="35%" />
			<p>6、点击网页中的输入框后，点击插件中预填的信息即可快速输入。</p>
		</div>
